# Config overlay for `dsh --patch ./plugin-test.cordis.yml`.
# The package still has to be installed in the target profile; this file only
# keeps the verbose/logging settings out of a persistent profile.
- insert:
    - id: adaptive-tool-router
      name: dsh-adaptive-tool-router
      config:
        shadow: true
        topK: 8
        verbose: true
        logPath: /tmp/dsh-tool-router-shadow.jsonl
        alwaysAllow:
          - tool_search
